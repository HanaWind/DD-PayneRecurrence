dataset: data/processed/lamost_training.h5
run_dir: outputs/train_local_smoke
device: cpu
seed: 42

model:
  hidden_size: 8
  activation_slope: 0.01
  pixel_chunk_size: 256

optimization:
  batch_size: 16
  max_steps: 3
  learning_rate_start: 0.001
  learning_rate_end: 0.0003
  weight_decay: 0.0
  gradient_clip_norm: 10.0
  mixed_precision: false
  num_workers: 0
  validation_every: 1
  checkpoint_every: 3

gradient_regularization:
  # Pipeline verification only. This is not a physical-gradient DD-Payne run.
  required: false
